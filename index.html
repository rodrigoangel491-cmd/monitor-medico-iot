<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor de Temperatura IoT</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #00adc1;
        }

        body { 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            background: var(--bg-color); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            transition: background 0.5s ease;
        }

        .card { 
            background: var(--card-bg); 
            padding: 2.5rem; 
            border-radius: 35px; 
            box-shadow: 0 25px 50px rgba(0,0,0,0.6); 
            text-align: center; 
            border: 3px solid var(--accent); 
            width: 340px;
            transition: all 0.5s ease;
        }

        h1 { 
            color: var(--accent); 
            font-size: 1rem; 
            letter-spacing: 3px; 
            margin-bottom: 10px; 
            text-transform: uppercase;
            transition: color 0.5s ease;
        }

        .temp-box { 
            background: rgba(15, 23, 42, 0.7); 
            border-radius: 25px; 
            padding: 40px 10px; 
            margin: 20px 0; 
            border: 1px solid rgba(255,255,255,0.1);
        }

        .value { 
            font-size: 5rem; 
            font-weight: 900; 
            color: #fff; 
            text-shadow: 0 0 30px rgba(0, 173, 193, 0.3);
        }

        .unit { font-size: 1.8rem; color: var(--accent); vertical-align: super; }

        .status-container {
            margin-bottom: 20px;
            padding: 8px 15px;
            background: rgba(0,0,0,0.2);
            border-radius: 50px;
            display: inline-flex;
            align-items: center;
        }

        .status-dot { 
            height: 12px; width: 12px; 
            background-color: #22c55e; 
            border-radius: 50%; 
            margin-right: 10px; 
            box-shadow: 0 0 15px #22c55e;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }

        .status-text { font-size: 0.85rem; color: #94a3b8; font-weight: 600; }

        .footer { 
            margin-top: 20px; 
            font-size: 0.8rem; 
            color: #cbd5e1; 
            line-height: 1.6; 
            border-top: 1px solid rgba(255,255,255,0.1); 
            padding-top: 20px; 
        }

        .credits-title {
            color: var(--accent);
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }

        .year-tag {
            display: block;
            margin-top: 8px;
            font-size: 0.7rem;
            color: #64748b;
            font-style: italic;
        }

        /* Colores según temperatura */
        .temp-cold { --accent: #3498db; }
        .temp-normal { --accent: #00adc1; }
        .temp-hot { --accent: #ff4757; }
    </style>
</head>
<body>
    <div id="mainCard" class="card temp-normal">
        <h1>Monitor de Temperatura</h1>
        
        <div class="temp-box">
            <span id="temp" class="value">--.-</span><span class="unit">°C</span>
        </div>

        <div class="status-container">
            <div class="status-dot"></div>
            <span id="status" class="status-text">SISTEMA ONLINE</span>
        </div>

        <div class="footer">
            <span class="credits-title">CRÉDITOS:</span>
            Estudiantes de Ingeniería Biomédica<br>
            <strong>Rodrigo Angel y Jose Tobar</strong><br>
            <span class="year-tag">Proyecto realizado en 2026</span>
        </div>
    </div>

    <script>
        const token = "KOO6wgz_gRwtfGocyHUkNvVl-XPdK3D7";
        const url = `https://blynk.cloud/external/api/get?token=${token}&V0`;

        async function updateTemp() {
            try {
                const response = await fetch(url);
                if (response.ok) {
                    const data = await response.text();
                    const tempValue = parseFloat(data);
                    document.getElementById('temp').innerText = tempValue.toFixed(1);
                    
                    const card = document.getElementById('mainCard');
                    
                    // Lógica de colores dinámica
                    if (tempValue < 30) {
                        card.className = "card temp-cold";
                    } else if (tempValue >= 30 && tempValue <= 37.5) {
                        card.className = "card temp-normal";
                    } else {
                        card.className = "card temp-hot";
                    }

                    document.getElementById('status').innerText = "ACTUALIZADO EN VIVO";
                }
            } catch (error) {
                document.getElementById('status').innerText = "BUSCANDO SEÑAL...";
            }
        }

        setInterval(updateTemp, 2000);
        updateTemp();
    </script>
</body>
</html>
